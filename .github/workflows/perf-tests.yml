name: Performance Tests (K6)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          curl -fsSL https://github.com/grafana/k6/releases/download/v0.56.0/k6-v0.56.0-linux-amd64.tar.gz | tar xzf -
          sudo mv k6-v0.56.0-linux-amd64/k6 /usr/local/bin/

      - name: Run K6 load test
        run: k6 run -e REQRES_API_KEY=${{ secrets.REQRES_API_KEY }} tests/performance/reqres-load-test.js
